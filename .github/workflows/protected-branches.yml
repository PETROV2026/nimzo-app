name: Protected branches

# GitHub's free plan cannot block direct pushes on private repos.
# This workflow detects them after the fact and opens an issue assigned to the software lead.

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  require-pull-request:
    name: Require pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check that the pushed commit came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$prs" -gt 0 ]; then
            echo "Commit $SHA was merged through a pull request."
            exit 0
          fi

          gh issue create --repo "$REPO" \
            --title "Direct push to $BRANCH detected" \
            --assignee Paytini \
            --body "@$ACTOR pushed commit $SHA directly to \`$BRANCH\` without a pull request. Review the change and, if needed, revert it and resubmit it through a PR."
          echo "::error::Direct push to $BRANCH without a pull request."
          exit 1
