name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - scripts/package-admin.mjs
      - packages/shared/**
      - packages/brand/**
      - supabase/migrations/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-admin.yml
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Build and publish the deploy-admin branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the Supabase variables
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the repository variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions > Variables). See docs/deploy-admin.md."
            exit 1
          fi

      - name: Build and package the admin panel
        run: pnpm admin:package
        env:
          VITE_BASE_PATH: ${{ vars.ADMIN_BASE_PATH || '/' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Check the package
        run: |
          test -f apps/admin/deploy/server.js
          test -f apps/admin/deploy/config.json
          test -f apps/admin/deploy/public/index.html
          node --check apps/admin/deploy/server.js

      - name: Check that the server starts
        working-directory: apps/admin/deploy
        run: |
          PORT=4000 node server.js &
          server_pid=$!
          sleep 1
          curl --fail --silent --output /dev/null http://localhost:4000/
          curl --fail --silent --output /dev/null http://localhost:4000/clients
          kill "$server_pid"

      - name: Publish to the deploy-admin branch
        working-directory: apps/admin/deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch deploy-admin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "deploy: admin panel from ${GITHUB_SHA::7}"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-admin
