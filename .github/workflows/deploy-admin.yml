name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - packages/shared/**
      - packages/brand/**
      - supabase/migrations/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-admin.yml
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Build and upload to GoDaddy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the admin panel
        run: pnpm --filter @nimzo/admin build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Check the build output
        run: |
          test -f apps/admin/dist/index.html
          test -f apps/admin/dist/.htaccess

      - name: Upload to GoDaddy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: apps/admin/dist/
          server-dir: ./
